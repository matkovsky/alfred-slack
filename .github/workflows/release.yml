# Push a tag like "v1.0" → builds the workflow and publishes a GitHub release with the
# .alfredworkflow attached. The version inside the workflow is taken from the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # osascript, plutil and sips are macOS-only
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: make test

      - name: Build
        run: make package VERSION="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/Slack-${GITHUB_REF_NAME#v}.alfredworkflow" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
